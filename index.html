<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>북마크 허브</title>
<style>
  :root {
    --lk-ink: #0F172A;
    --lk-soft: #64748B;
    --lk-mute: #94A3B8;
    --lk-line: #E8EDF4;
    --lk-fill: #F8FAFC;
    --lk-btn: #111827;
    --lk-danger: #DC2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { min-height: 100%; }
  body {
    min-height: 100%;
    background: #FFFFFF;
    color: var(--lk-ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 잠금 화면 ---------- */
  #lock {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #FFFFFF;
  }
  #lock[hidden] { display: none; }
  .lock-card {
    width: 100%; max-width: 356px; text-align: center;
    padding: 34px 26px 26px;
    border: 1px solid var(--lk-line);
    border-radius: 20px;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 16px 40px -18px rgba(15, 23, 42, .18);
  }
  .lock-emoji { font-size: 26px; line-height: 1; }
  .lock-title {
    margin: 12px 0 6px;
    font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: var(--lk-ink);
  }
  .lock-desc {
    margin: 0 0 22px;
    font-size: 13.5px; color: var(--lk-soft);
  }
  .lock-form { display: flex; flex-direction: column; gap: 10px; }
  #pw {
    width: 100%; padding: 13px 14px;
    text-align: center;
    font-size: 18px; letter-spacing: 0.3em; font-variant-numeric: tabular-nums;
    color: var(--lk-ink); background: var(--lk-fill);
    border: 1px solid var(--lk-line); border-radius: 12px;
    outline: none; -webkit-appearance: none; appearance: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #pw::placeholder { letter-spacing: normal; font-size: 14px; color: var(--lk-mute); }
  #pw:focus { background: #FFFFFF; border-color: #CBD5E1; box-shadow: 0 0 0 4px rgba(148, 163, 184, .14); }
  #openBtn {
    width: 100%; padding: 13px 14px;
    border: 0; border-radius: 12px;
    background: var(--lk-btn); color: #FFFFFF;
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: opacity .15s ease;
  }
  #openBtn:hover { opacity: .9; }
  #openBtn:disabled { opacity: .55; cursor: default; }
  #err { min-height: 18px; margin: 0; font-size: 12.5px; color: var(--lk-danger); }
  .lock-note { margin: 16px 0 0; font-size: 11.5px; color: var(--lk-mute); line-height: 1.6; }

  /* ---------- 복호화된 앱 / 잠금 버튼 ---------- */
  #bh-root[hidden] { display: none; }
  #lockBtn[hidden] { display: none; }
  #lockBtn {
    position: fixed; right: 14px; bottom: 14px; z-index: 50;
    width: 38px; height: 38px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--lk-line); border-radius: 999px;
    background: rgba(255, 255, 255, .92);
    color: var(--lk-soft); font-family: inherit; font-size: 15px; line-height: 1;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 2px 10px rgba(15, 23, 42, .10);
    transition: opacity .15s ease;
  }
  #lockBtn:hover { opacity: .8; }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <div class="lock-emoji" aria-hidden="true">🔒</div>
    <h1 class="lock-title">북마크 허브</h1>
    <p class="lock-desc">4자리 비밀번호를 입력하세요</p>
    <form class="lock-form" id="lockForm" autocomplete="off">
      <label for="pw" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">비밀번호</label>
      <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             placeholder="4자리 비밀번호" autocomplete="off" autocapitalize="off" spellcheck="false"
             aria-describedby="err">
      <button id="openBtn" type="submit">열기</button>
      <p id="err" role="status" aria-live="polite"></p>
    </form>
    <p class="lock-note">이 기기에서 한 번 열면 다음부터는 자동으로 열립니다.</p>
  </div>
</div>

<div id="bh-root" hidden></div>
<button id="lockBtn" type="button" title="잠그기" aria-label="잠그기" hidden>🔒</button>

  var ITERATIONS = 100000;
  var STORE_KEY = "bookmarks-hub:aes-key:v1";

  var lockEl = document.getElementById("lock");
  var rootEl = document.getElementById("bh-root");
  var lockBtn = document.getElementById("lockBtn");
  var form = document.getElementById("lockForm");
  var pwEl = document.getElementById("pw");
  var openBtn = document.getElementById("openBtn");
  var errEl = document.getElementById("err");

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesToB64(bytes) {
    var s = "", chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  function hasCrypto() {
    return !!(window.crypto && window.crypto.subtle && window.TextEncoder && window.TextDecoder);
  }

  function keyFromPassword(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
      });
  }

  function decryptWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(IV_B64) }, key, b64ToBytes(CT_B64))
      .then(function (buf) {
        return JSON.parse(new TextDecoder("utf-8").decode(buf));
      });
  }

  var mounted = false;

  function mount(app) {
    if (mounted) return;
    mounted = true;

    var st = document.createElement("style");
    st.id = "bh-style";
    st.textContent = app.css;
    document.head.appendChild(st);

    rootEl.innerHTML = app.html;
    rootEl.hidden = false;
    lockEl.hidden = true;
    lockBtn.hidden = false;

    var sc = document.createElement("script");
    sc.textContent = app.js;
    document.body.appendChild(sc);

    if (window.scrollTo) window.scrollTo(0, 0);
  }

  function unmount() {
    mounted = false;
    var st = document.getElementById("bh-style");
    if (st && st.parentNode) st.parentNode.removeChild(st);
    rootEl.innerHTML = "";
    rootEl.hidden = true;
    lockBtn.hidden = true;
    lockEl.hidden = false;
    errEl.textContent = "";
    pwEl.value = "";
  }

  function storeKey(key) {
    if (!crypto.subtle.exportKey) return;
    crypto.subtle.exportKey("raw", key).then(function (raw) {
      try { localStorage.setItem(STORE_KEY, bytesToB64(new Uint8Array(raw))); } catch (e) {}
    }).catch(function () {});
  }

  function forgetKey() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  function autoUnlock() {
    var saved = null;
    try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
    if (!saved) return;
    crypto.subtle.importKey("raw", b64ToBytes(saved), { name: "AES-GCM" }, true, ["decrypt"])
      .then(decryptWith)
      .then(function (app) { mount(app); })
      .catch(function () { forgetKey(); });
  }

  if (!hasCrypto()) {
    errEl.textContent = "이 브라우저에서는 암호를 풀 수 없습니다. 최신 브라우저에서 열어 주세요.";
    openBtn.disabled = true;
    return;
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = pwEl.value.trim();
    if (!pw) { pwEl.focus(); return; }

    openBtn.disabled = true;
    errEl.textContent = "";

    keyFromPassword(pw)
      .then(function (key) {
        return decryptWith(key).then(function (app) {
          storeKey(key);
          mount(app);
          pwEl.value = "";
        });
      })
      .catch(function () {
        errEl.textContent = "비밀번호가 맞지 않습니다";
        pwEl.value = "";
        pwEl.focus();
      })
      .then(function () { openBtn.disabled = false; });
  });

  lockBtn.addEventListener("click", function () {
    forgetKey();
    unmount();
    pwEl.focus();
  });

  autoUnlock();
})();
</script>
